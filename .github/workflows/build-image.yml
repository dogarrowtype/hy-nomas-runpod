name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN publishes to GHCR; no PAT needed. After the first run, set the
# package visibility to public and link it to the repo (one-time click).
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The image is large (CUDA runtime base + cu130 torch + flash-attn);
        # reclaim preinstalled toolchains to stay under the 14 GB runner disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image ref
        # GHCR requires lowercase repository paths.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Image reference
        # Pin the RunPod template to the digest printed here (or the git-sha tag),
        # not floating :latest, for reproducibility.
        run: echo "pushed ${{ env.IMAGE }}:${{ github.sha }}"
